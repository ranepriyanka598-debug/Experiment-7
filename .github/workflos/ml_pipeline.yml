

name: ML Model CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas numpy scikit-learn pytest

      - name: Automated Build
        run: |
          echo "Build Process Started"
          python --version

      - name: Create Model Training Script
        run: |
          cat > train.py <<'EOF'
          from sklearn.datasets import load_iris
          from sklearn.model_selection import train_test_split
          from sklearn.ensemble import RandomForestClassifier
          from sklearn.metrics import accuracy_score

          data = load_iris()
          X_train, X_test, y_train, y_test = train_test_split(
              data.data, data.target,
              test_size=0.2, random_state=42
          )

          model = RandomForestClassifier(random_state=42)
          model.fit(X_train, y_train)

          accuracy = accuracy_score(
              y_test, model.predict(X_test)
          )

          print("Model Accuracy:", accuracy)

          if accuracy < 0.8:
              raise ValueError("Model accuracy is too low")
          EOF

      - name: Validate Model Training
        run: python train.py

      - name: Generate Build Report
        if: always()
        run: |
          echo "Experiment No. 7" > build_report.txt
          echo "Name: Priyanka Rane" >> build_report.txt
          echo "Build and Testing Workflow Completed" >> build_report.txt

      - name: Upload Build Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build_report.txt
